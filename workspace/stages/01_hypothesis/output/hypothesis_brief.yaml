# Wave-1 hypothesis brief (stage-01 output, pre-registration batch H1-H4)
# Supersedes H-SLX-1 brief (verdict recorded in docs/data/eval_ml_sl_exit.json).
family: "wave1_scoping_regime_sizing_newdata"

universe: >
  Primary: frozen 481-name S&P 500 snapshot (cache/cycle3_13f_ticker_map.json)
  intersected with local daily OHLCV panel market_data_2019_2026/ohlcv/
  (2019-01-02..2026-08-07). H1 restricts selection to frozen Universe A
  (AAPL MSFT GOOGL AMZN NVDA META TSLA JPM V JNJ WMT MA UNH XOM DIS).
  SPY excluded from selection everywhere.

hypotheses:
  h1_megacap_momentum: >
    us_momentum_top5 restricted to Universe A beats SPY on OOS net CAGR AND
    Sharpe; generalizes the 3x A_megacap_base B-gate conditioning passes to
    the momentum core (claim-scoping lane).
  h2_fred_regime_momentum: >
    us_momentum_top5 invested only when FRED regime == RISK_ON (else cash)
    beats SPY on OOS net CAGR AND Sharpe; exogenous macro filter, untested on
    this core (SMA sweep tested only price-derived states).
  h3_voltarget_overlay: >
    Inverse-vol sizing m_t = clamp(0.15/sigma21d, 0.25, 1.00) at month-ends on
    the incumbent improves OOS net Sharpe by >= +0.10 while keeping net CAGR
    above SPY (sizing lane; no-margin cap 1.00).
  h4_poltrade_cramer_pair: >
    Arm P congressional PTR follow (+45d filing lag, 90d hold) and Arm C
    Cramer follow/fade pair each face the full six-gate chain; power gate
    <40 events => INSUFFICIENT_POWER honest no-op per arm.

acceptance: >
  Per candidate, verbatim from its frozen prereg (docs/data/wave1_h{1,2,3,4}_*.md):
  six gates = prereg-before-test; IS block-bootstrap p<=0.05 on net excess vs
  SPY-engine; combinatorially purged CV K=6 embargo 10d all-positive; WF 5
  expanding folds all-positive with <=60% single-fold share; circular-block
  permutation p95 survival (block=10, 1000 draws, seed 7); positive DSR ledger
  entry via scripts/preregister.py record. Charter bar conjunctive: OOS net
  CAGR > SPY AND OOS net Sharpe > SPY, same engine/window/fees.

lookback_constraints: >
  Daily OHLCV + pre-authorized free sources only. No lookahead: all features
  from bars <= decision bar t; execution t+1; regime labels applied with
  verified point-in-time lag (H2 branch A/B declared in prereg); H4 entries use
  disclosure/publication availability timestamps only. IS <= 2023-12-31;
  OOS 2024-01-01..2026-08-07. Serial single-file verification only; no batch
  suites.

edge_gate_params:
  preregistration_files:
    - docs/data/wave1_h1_megacap_momentum_prereg.md
    - docs/data/wave1_h2_fred_regime_momentum_prereg.md
    - docs/data/wave1_h3_voltarget_overlay_prereg.md
    - docs/data/wave1_h4_poltrade_cramer_prereg.md
  costs_bps_per_side: 5
  exec_delay_bars: 1
  null_test: "circular block shuffle block=10 days, 1000 draws, seed=7, statistic=OOS annualized net excess Sharpe"
  is_test: "stationary block bootstrap mean-block=21d, 1000 draws, seed=7, two-sided p on IS net excess"
  dsr_trials_charged: {h1: 1, h2: 1, h3: 1, h4: 3}
  kill_criteria: >
    Any gate FAIL => honest FAIL ledger entry like topic07/H-SLX-1. Borderline
    p~0.05 = FAIL. Over-parameterization or post-hoc universe/window/metric
    changes = kill. Static canonical configs stay canonical until beaten under
    these rules.

paper_only: true
