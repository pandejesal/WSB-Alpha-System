# Required: Acceptance criteria checklist.
# Example:
# - Edge claim is pre-registered in docs/data/.
# - YAML spec is fully complete and parses without errors.
# - registry.json is updated and wired correctly.
# - Strategy passes Walk-Forward validation, Permutation tests, and achieves a positive Deflated Sharpe Ratio (DSR) ledger entry.
acceptance: ""

# Required: Lookback/data constraints.
# Example: "Daily OHLCV, no intraday data, no lookahead bias."
lookback_constraints: ""

# Required: Edge-gate parameters (dictionary of specific parameter constraints or flags for the test scripts).
edge_gate_params: {}
