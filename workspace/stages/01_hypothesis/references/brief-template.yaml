# DO NOT MODIFY THIS TEMPLATE DIRECTLY. Copy it to create a new brief.

# Required: The target strategy family. Must correspond to a conceptual edge.
# Example: "breakout_burst"
family: ""

# Required: The target universe & timeframe constraint.
# Example: "100-stock liquid large-cap panel (excluding SPY/QQQ/AGG/BND), 2019-2026 Daily OHLCV"
universe: ""

# Required: The core market inefficiency or edge being targeted. Must be testable.
# Example: "Assets exhibiting a daily close > 20-day high with 1.5x average volume will outperform the baseline over a 20-day holding period."
