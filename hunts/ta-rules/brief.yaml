family: ta_rules
universe: "100-stock liquid large-cap panel (excluding SPY/QQQ/AGG/BND)"
hypothesis: "Technical analysis heuristics derived from momentum oscillators (RSI, MACD) and trend-following crossover systems (EMA) capture repeatable short-term price inefficiencies in liquid large-cap equities. Specifically, assets showing oversold momentum or regime-filtered moving average crossovers will outperform a buy-and-hold baseline over a 1 to 20-day holding period."
acceptance: "Pass walk-forward validation (OOS positive absolute return), pass permutation robustness (at least 60% of perturbed parameter configurations yield positive Sharpe), and record a positive Deflated Sharpe Ratio (DSR) ledger entry."
lookback_constraints: "2019-2026 daily data window"
edge_gate_params:
  min_oos_sharpe: 0.5
  min_dsr: 0.0
  permutation_pass_rate: 0.6
