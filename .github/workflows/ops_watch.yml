name: Ops Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Write Heartbeat
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/ops/heartbeat.py --job ops_watch

      - name: Run Ops Watch
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/ops/watch.py

      - name: Commit State Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add config/ops_state.yaml docs/data/ops/watch_offset.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ops): Update watch state" && git push origin HEAD:${GITHUB_REF_NAME})
