name: Generate Strategy Data

on:
  schedule:
    - cron: '0 7 * * 0'  # Weekly on Sunday 2 AM EST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Generate strategy data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=. python scripts/generate_strategy_data.py

      - name: Commit strategy data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/strategies.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update strategy data for dashboard"
            git push
          fi