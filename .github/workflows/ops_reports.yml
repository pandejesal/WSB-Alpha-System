name: Ops Reports

on:
  schedule:
    - cron: '0 12 * * 6' # 12:00 UTC Saturday (weekly)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Write Heartbeat
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/ops/heartbeat.py --job ops_reports

      - name: Run Sharpe Computation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/generate_sharpe.py

      - name: Run Permutation Study
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_permutation_study.py

      - name: Commit Reports
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/paper/sharpe.json docs/data/permutation_study.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ops): Update weekly Sharpe and Permutation reports" && git push origin HEAD:${GITHUB_REF_NAME})
