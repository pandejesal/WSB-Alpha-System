name: Bounded Self-Improvement Loop

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-data-writers
  cancel-in-progress: false

jobs:
  self_improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch paper trading logs branch
        run: git fetch origin paper_trading_logs || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Self-Improvement Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m src.research.self_improvement_agent

      - name: Create Pull Request or Commit Change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/backtest/run_historic_backtest.py self_improvement_log.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "Self-Improvement: Applied proposed strategy change"
            git pull --rebase --autostash origin main || (git checkout --theirs -- src/backtest/run_historic_backtest.py self_improvement_log.md && git add src/backtest/run_historic_backtest.py self_improvement_log.md && git rebase --continue)
            git push origin main
          fi
