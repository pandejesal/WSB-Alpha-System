name: Paper Trade Execution

on:
  schedule:
    - cron: '30 14 * * 1-5' # 14:30 UTC Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute_plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Paper Executor
        env:
          PYTHONPATH: ${{ github.workspace }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PAPER_TRADING_ENABLED: 'True'
          LIVE_TRADING_ENABLED: 'False'
        run: python scripts/run_paper_execution.py

      - name: Commit Ops Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/ops/*.json docs/data/ops/*.jsonl || true
          git add config/ops_state.yaml || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ops): Paper execution state update" && git push origin HEAD:${GITHUB_REF_NAME})
