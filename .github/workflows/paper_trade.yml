name: Paper Trade Execution

on:
  schedule:
    # Weekday-only, after the NYSE close-aware 20:55 UTC slot shared with the
    # sandbox job (audit finding F2: the previous '30 14 * * *' ran on weekends
    # when US equity markets are closed).
    - cron: '55 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute_plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Write Heartbeat
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/ops/heartbeat.py --job paper_trade

      - name: Run Paper Executor
        env:
          PYTHONPATH: ${{ github.workspace }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PAPER_TRADING_ENABLED: 'True'
          # Paper-only by construction (audit finding F2): the executor builds
          # its broker with paper=True and hard-errors if LIVE_TRADING_ENABLED
          # is set, so this workflow no longer forwards the live-gate flag.
        run: python scripts/run_paper_execution.py

      - name: Commit Ops Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/ops/*.json docs/data/ops/*.jsonl || true
          git add config/ops_state.yaml || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ops): Paper execution state update" && git push origin HEAD:${GITHUB_REF_NAME})
