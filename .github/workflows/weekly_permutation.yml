name: Weekly Permutation Study

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2 AM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_permutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Permutation Study
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_permutation_study.py

      - name: Write Heartbeat
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/ops/heartbeat.py --job weekly_permutation

      - name: Commit Artifact
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/permutation_study.json docs/data/ops/heartbeat.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ops): Update permutation study" && git config --global push.default current)
          git push origin HEAD:${GITHUB_REF_NAME}
